        // --- FUNGSI BARU: PDF GENERATOR ---
        function generatePDF(elementId, filename) {
            const element = document.getElementById(elementId);
            
            if (!element) {
                showNotification('Area konten tidak ditemukan!', 'error');
                return;
            }

            // Konfigurasi untuk html2pdf (untuk hasil A4 portrait yang optimal)
            const opt = {
                margin: 0.5, // Margin (dalam inci)
                filename: filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, logging: false, dpi: 192, letterRendering: true },
                jsPDF: { unit: 'in', format: 'A4', orientation: 'portrait' }
            };
            
            // Gunakan fungsi html2pdf untuk membuat dan menyimpan PDF
            html2pdf().set(opt).from(element).save();
            showNotification('PDF sedang dibuat dan akan segera diunduh!', 'success');
        }

        // NEW: Function to render student list grouped by class
        function renderStudentGroupedByClass(displayData, isAdminOrSuperAdmin, currentModule) {
            if (displayData.length === 0) {
                return `<div class="text-center p-6 rounded-xl text-gray-500">Tidak ada data siswa yang ditemukan di regional ini atau filter kelas yang dipilih.</div>`;
            }

            // Get available classes for the current region
            const regionalClasses = availableClasses.filter(c => 
                currentUser.role === 'Super Admin' ? (selectedAdminRegion === 'all' || c.region === selectedAdminRegion) : c.region === currentUser.region
            );

            // Group students by class
            const groupedStudents = regionalClasses.reduce((groups, classItem) => {
                const students = displayData.filter(s => s.class === classItem.name);
                if (students.length > 0) {
                    groups[classItem.name] = students;
                }
                return groups;
            }, {});

            if (Object.keys(groupedStudents).length === 0) {
                 return `<div class="text-center p-6 rounded-xl text-gray-500">Tidak ada siswa yang terdaftar di kelas yang tersedia atau filter kelas yang dipilih.</div>`;
            }

            let contentHtml = '';

            const detailFunction = currentModule === 'artProgress' 
                ? 'showStudentArtDetail' 
                : currentModule === 'skolastikProgress' 
                ? 'showStudentSkolastikDetail' 
                : 'showStudentTkaDetail';

            for (const className in groupedStudents) {
                const studentsInClass = groupedStudents[className];
                
                // Get overall class stats for the module (if relevant)
                let classStatHtml = '';
                if (currentModule === 'artProgress') {
                    const totalArtworks = studentsInClass.reduce((total, student) => total + student.artworks.length, 0);
                    const totalAttendance = studentsInClass.reduce((total, student) => total + student.attendance.length, 0);
                    const totalHadir = studentsInClass.reduce((total, student) => total + student.attendance.filter(a => a.status === 'Hadir').length, 0);
                    const avgAttendance = totalAttendance > 0 ? ((totalHadir / totalAttendance) * 100).toFixed(1) : 0;
                    classStatHtml = `<p class="text-sm text-gray-600 mt-2">Total Karya: ${totalArtworks} | Rata-rata Kehadiran: ${avgAttendance}%</p>`;
                } else if (currentModule === 'skolastikProgress') {
                    const allScores = studentsInClass.flatMap(s => s.skolastikTests.map(t => t.score));
                    const avgScore = allScores.length > 0 ? (allScores.reduce((sum, score) => sum + score, 0) / allScores.length).toFixed(1) : 0;
                    classStatHtml = `<p class="text-sm text-gray-600 mt-2">Total Tes Skolastik: ${allScores.length} | Rata-rata Nilai: <span class="font-bold text-blue-600">${avgScore}</span></p>`;
                } else if (currentModule === 'tkaProgress') {
                     const allScores = studentsInClass.flatMap(s => s.tkaTests.map(t => t.score));
                    const avgScore = allScores.length > 0 ? (allScores.reduce((sum, score) => sum + score, 0) / allScores.length).toFixed(1) : 0;
                    classStatHtml = `<p class="text-sm text-gray-600 mt-2">Total Tes TKA: ${allScores.length} | Rata-rata Nilai: <span class="font-bold text-purple-600">${avgScore}</span></p>`;
                }

                contentHtml += `
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 rounded-xl mb-6 shadow-md rounded-xl">
                        <h3 class="text-xl font-bold text-blue-800 mb-2">Kelas ${className} (${studentsInClass.length} Siswa)</h3>
                        ${classStatHtml}
                        <div class="mt-4 space-y-3">
                            ${studentsInClass.map(student => `
                                <div class="flex justify-between items-center p-4 rounded-xl bg-white border border-gray-200 rounded-lg shadow-sm">
                                    <div>
                                        <p class="font-semibold text-gray-900">${student.name}</p>
                                        <p class="text-sm text-gray-600">${student.school || 'Sekolah belum ditentukan'}</p>
                                    </div>
                                    <button onclick="${detailFunction}(${student.id})" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm">
                                        Lihat Detail
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return contentHtml;
        }

        // Helper function: Groups artworks by Month and Year
        function groupArtworksByMonth(artworks) {
            return artworks.reduce((groups, artwork) => {
                // Get YYYY-MM format from date
                const monthYear = artwork.date.substring(0, 7); 
                if (!groups[monthYear]) {
                    groups[monthYear] = [];
                }
                groups[monthYear].push(artwork);
                return groups;
            }, {});
        }

            function mapClassToCategory(cls) {
                if (!cls) return null;
                const s = cls.toString().trim().toLowerCase();
                if (/sr\s*gold|(^|\s)gold(\s|$)/i.test(cls)) return 'SR GOLD';
                if (/sr\s*advance|(^|\s)advance(\s|$)/i.test(cls)) return 'SR ADVANCE';
                if (/minat\s*seni/i.test(cls)) return 'MINAT SENI';
                if (/minat\s*arsitektur/i.test(cls)) return 'MINAT ARSITEKTUR';
                if (/arsitek|arsitektur/i.test(cls)) return 'ARSITEKTUR';

      const newStudent = { id: newId, name, username, password, class: kelas, region, school, artworks: [], attendance: [], skolastikTests: [], tkaTests: []};

      saveAllData();
      showNotification('Siswa berhasil ditambahkan!');
      loadAddStudent();
    });
  }
}

  rows.forEach(r => {

}

function filterClasses() {

    row.style.display = (matchRegion && matchClass) ? '' : 'none';
  });
}

<script>
(function(){
  // Format a single ISO date string (YYYY-MM-DD) to DD/MM/YYYY
  function formatDateDDMMYYYY(dateString) {
    if (!dateString) return dateString;
    // already in DD/MM/YYYY
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(dateString)) return dateString;
    // iso yyyy-mm-dd (may include time)
    const m = dateString.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
    if (m) {
      return m[3] + '/' + m[2] + '/' + m[1];
    }
    return dateString;
  }

  // Replace ISO dates inside text nodes under root element
  function replaceDatesInTextNode(node) {
    if (!node || node.nodeType !== Node.TEXT_NODE) return;
    const text = node.nodeValue;
    // find iso dates like 2025-11-10 maybe with time portion removed
    const newText = text.replace(/\b(\d{4}-\d{2}-\d{2})(?:\b|(?=\s|,|\.))/g, function(_, iso){
      return formatDateDDMMYYYY(iso);
    });
    if (newText !== text) node.nodeValue = newText;
  }

  // Walk the DOM under root and update text nodes (skip script, style, textarea, pre, code, input)
  function traverseAndFormat(root) {
    if (!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        // ignore empty/whitespace nodes
        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        const parent = node.parentElement;
        if (!parent) return NodeFilter.FILTER_REJECT;
        const tag = parent.tagName.toLowerCase();
        const ignoreTags = ['script','style','textarea','code','pre','option'];
        if (ignoreTags.includes(tag)) return NodeFilter.FILTER_REJECT;
        // skip if inside an element with data-no-format attribute
        if (parent.closest && parent.closest('[data-no-format]')) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    }, false);
    let node;
    const nodesToProcess = [];
    while(node = walker.nextNode()) nodesToProcess.push(node);
    nodesToProcess.forEach(replaceDatesInTextNode);
  }

  // Observe DOM changes and format newly added text nodes
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(m => {
      m.addedNodes.forEach(n => {
        // If an element node is added, traverse it
        if (n.nodeType === Node.ELEMENT_NODE) {
          // small delay to allow templating engines to populate text
          setTimeout(() => traverseAndFormat(n), 20);
        } else if (n.nodeType === Node.TEXT_NODE) {
          replaceDatesInTextNode(n);
        }
      });
      // also handle characterData changes
      if (m.type === 'characterData' && m.target) replaceDatesInTextNode(m.target);
    });
  });

  // Start observing the whole body for subtree changes
  function startObserver() {
    try {
      observer.observe(document.body, { childList: true, subtree: true, characterData: true });
    } catch (e) {
      // ignore on pages that block MutationObserver
      console.warn('Date format observer failed', e);
    }
  }

  // Wrap existing openModal to format modal content after opening (if present)
  function wrapOpenModal() {
    if (typeof window.openModal === 'function' && !window.openModal._wrappedForDateFormat) {
      const orig = window.openModal;
      window.openModal = function(title, contentHtml) {
        orig(title, contentHtml);
        const modal = document.getElementById('modal');
        if (modal) setTimeout(() => traverseAndFormat(modal), 50);
      };
      window.openModal._wrappedForDateFormat = true;
    }
  }

  // Initial run after DOMContentLoaded
  function init() {
    traverseAndFormat(document.body);
    startObserver();
    wrapOpenModal();
    // also wrap any known module renderers to ensure format after rendering
    const hooks = ['loadHome','loadSchedule','loadActivitySchedule','loadArtProgress','loadSkolastikProgress','loadTkaProgress','loadMaterials','loadEducationInfo','loadManageAdmins','loadLogActivity','loadLearningSchedule'];
    hooks.forEach(fnName => {
      if (typeof window[fnName] === 'function' && !window[fnName]._wrappedForDateFormat) {
        const orig = window[fnName];
        window[fnName] = function() {
          const res = orig.apply(this, arguments);
          setTimeout(() => traverseAndFormat(document.body), 40);
          return res;
        };
        window[fnName]._wrappedForDateFormat = true;
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // expose util for manual use
  window.formatDateDDMMYYYY = formatDateDDMMYYYY;
  window.applyDateFormatting = function(root){ traverseAndFormat(root || document.body); };
})();
</script>

document.addEventListener("DOMContentLoaded", () => {
    const banned = ["cabang", "pusat"];

    function cleanNode(node) {
        if (node.nodeType === Node.TEXT_NODE) {
            let t = node.textContent;
            banned.forEach(w => {
                const rg = new RegExp("\\b" + w + "\\b", "gi");
                t = t.replace(rg, "").trim();
            });
            node.textContent = t;
        } else {
            node.childNodes.forEach(cleanNode);
        }
    }

    cleanNode(document.body);

    const obs = new MutationObserver(muts => {
        muts.forEach(m => {
            m.addedNodes.forEach(n => {
                try { cleanNode(n); } catch(e){}
            });
        });
    });

    obs.observe(document.body, { childList: true, subtree: true });
});
</script>

    const sel = document.getElementById('filterKelasSelect_' + modulName);
    const chk = document.getElementById('showAllKelas_' + modulName);
    if (sel) sel.addEventListener('change', () => applyKelasFilterUnified(modulName));
    if (chk) chk.addEventListener('change', () => applyKelasFilterUnified(modulName));
  }

  // Unified apply filter
  function applyKelasFilterUnified(modulName) {
    try {
      const select = document.getElementById('filterKelasSelect_' + modulName);
      const showAll = document.getElementById('showAllKelas_' + modulName)?.checked;
      const kelasDipilih = select ? select.value : null;
      const userRole = currentUser?.role || '';
      const userKelas = currentUser?.kelas || '';

      document.querySelectorAll('[data-modul="' + modulName + '"][data-kelas]').forEach(row => {
        const kelasData = row.dataset.kelas;
        if (userRole === 'Admin' || userRole === 'Admin Regional') {
          row.style.display = (showAll || !kelasDipilih || kelasData === kelasDipilih) ? '' : 'none';
        } else if (userRole === 'Siswa') {
          row.style.display = kelasData === userKelas ? '' : 'none';
        } else {
          // default: show
          row.style.display = '';
        }
      });
    } catch (e) {
      console.warn('applyKelasFilterUnified error', e);
    }
  }

  // Unified render checklist filter (alternate UI)
  function renderFilterKelasUnified(containerId, modulName) {
    const container = document.getElementById(containerId);
    if (!container) return;
    let html = '<div class="mb-2"><label class="block mb-1 text-sm font-medium">Kelas Relevan</label>';
    window.daftarKelas.forEach(kls => {
      const id = `${modulName}_${kls.replace(/\s+/g, '_')}`;
      html += `<div class='flex items-center gap-2 mb-1'><input type='checkbox' id='${id}' value='${kls}' class='kelasCheckbox_${modulName}'> <label for='${id}'>${kls}</label></div>`;
    });
    html += '</div>';
    container.innerHTML = html;
    document.querySelectorAll('.kelasCheckbox_' + modulName).forEach(cb => {
      cb.addEventListener('change', () => applyFilterKelasUnified(modulName));
    });
  }

  function applyFilterKelasUnified(modulName) {
    try {
      const userRole = currentUser?.role || '';
      const userKelas = currentUser?.kelas || '';
      const selected = Array.from(document.querySelectorAll('.kelasCheckbox_' + modulName + ':checked')).map(cb => cb.value);

      document.querySelectorAll('[data-modul="' + modulName + '"][data-kelas]').forEach(row => {
        const kelasData = row.dataset.kelas;
        if (userRole === 'Admin' || userRole === 'Admin Regional') {
          row.style.display = selected.length === 0 || selected.includes(kelasData) ? '' : 'none';
        } else if (userRole === 'Siswa') {
          row.style.display = kelasData === userKelas ? '' : 'none';
        } else {
          row.style.display = '';
        }
      });
    } catch (e) {
      console.warn('applyFilterKelasUnified error', e);
    }
  }

  // Safe wrapper to extend existing load functions without redeclaring originals.
  function safeWrapLoad(fnName, containerId, modulName, useChecklist=false) {
    try {
      const origName = '__orig__' + fnName;
      if (!window[origName] && typeof window[fnName] === 'function') {
        window[origName] = window[fnName];
      }
      // Replace with wrapped
      window[fnName] = function() {
        if (typeof window[origName] === 'function') try { window[origName](); } catch(e){ console.warn(fnName+' original error', e); }
        // render appropriate UI
        if (useChecklist) renderFilterKelasUnified(containerId, modulName);
        else renderDropdownKelasUnified(containerId, modulName);
        // small delay for applying filter to allow DOM nodes to be present
        setTimeout(() => {
          if (useChecklist) applyFilterKelasUnified(modulName);
          else applyKelasFilterUnified(modulName);
        }, 300);
      };
    } catch (e) {
      console.warn('safeWrapLoad error for ' + fnName, e);
    }
  }

  // Apply wrappers for three target modules (id of container, moduleName, and whether to use checklist)
  safeWrapLoad('loadJadwalBelajar', 'filterKelasJadwalBelajar', 'jadwalBelajar', true);
  safeWrapLoad('loadJadwalKegiatan', 'filterKelasJadwalKegiatan', 'jadwalKegiatan', true);
  safeWrapLoad('loadMateriKelas', 'filterKelasMateriKelas', 'materiKelas', false);

  // Also wrap loadArtProgress to enable zoom feature if original exists, but avoid redeclare
  try {
    const origArt = '__orig__loadArtProgress';
    if (!window[origArt] && typeof window.loadArtProgress === 'function') {
      window[origArt] = window.loadArtProgress;
    }
    window.loadArtProgress = function(){
      if (typeof window[origArt] === 'function') try { window[origArt](); } catch(e){ console.warn('loadArtProgress original error', e); }
      setTimeout(()=>{ if (typeof enableZoomForStudent === 'function') enableZoomForStudent(); }, 400);
    };
  } catch(e){ console.warn(e); }

  // expose unified functions (for debugging)
  window.renderDropdownKelasUnified = renderDropdownKelasUnified;
  window.applyKelasFilterUnified = applyKelasFilterUnified;
  window.renderFilterKelasUnified = renderFilterKelasUnified;
  window.applyFilterKelasUnified = applyFilterKelasUnified;

})();

<script>
/*
  Overriding loadSchedule to:
  - Render Admin table: NO | TANGGAL | HARI | WAKTU | NAMA MATERI | KELAS | AKSI
  - Render Student table: NO | TANGGAL | HARI | WAKTU | NAMA MATERI
  - Admin sees only their region schedules; Super Admin can filter by region (selectedAdminRegion)
  - Student sees only their region + their class
  - CRUD buttons rendered only for Admin/Super Admin
  - Keeps existing add/edit/delete functions
*/
window.loadSchedule = function() {
  try {
    const content = document.getElementById('contentArea');
    if (!content) return;
    const role = currentUser && currentUser.role ? currentUser.role : 'Guest';
    const isAdmin = role === 'Admin' || role === 'Super Admin';
    // Prepare regional filtering
    let regional = 'all';
    if (role === 'Admin') regional = currentUser.region;
    else if (role === 'Super Admin') regional = selectedAdminRegion || 'all';
    // Prepare class filter for admin
    const classFilter = selectedClassSchedule || 'all';
    // Build base schedule list filtered by region (and for students further by class)
    let list = Array.isArray(scheduleData) ? scheduleData.slice() : [];
    if (role === 'Admin') {
      list = list.filter(s => s.region === currentUser.region);
    } else if (role === 'Super Admin' && regional !== 'all') {
      list = list.filter(s => s.region === regional);
    } else if (role === 'Siswa') {
      // find student record to identify class and region
      const stud = studentsData.find(s => s.username === currentUser.username || s.name === currentUser.name);
      if (!stud) {
        content.innerHTML = '<div class="p-6 bg-white rounded-xl shadow text-center text-gray-700">Data siswa tidak ditemukan.</div>';
        return;
      }
      list = list.filter(s => (s.region === stud.region) && (Array.isArray(s.classes) ? s.classes.includes(stud.class) : (s.classTarget ? s.classTarget === stud.class : true)));
    }

    // Apply admin class filter (if any)
    if (isAdmin && classFilter && classFilter !== 'all') {
      list = list.filter(s => {
        if (Array.isArray(s.classes)) return s.classes.includes(classFilter);
        if (s.classTarget) return s.classTarget === classFilter;
        return false;
      });
    }

    // Normalize date sorting
    list.sort((a,b) => {
      const da = a.date || '';
      const db = b.date || '';
      return (new Date(da) - new Date(db));
    });

    // Build header area
    let headerHtml = `<div class="fade-in mb-6">
        <div class="flex justify-between items-center">
          <h2 class="text-2xl font-bold text-gray-900">📅 Jadwal Belajar ${role === 'Siswa' ? '' : (role === 'Admin' ? '(' + (currentUser.region || '') + ')' : '(Semua Regional)')}</h2>
          ${isAdmin ? '<button onclick="openAddScheduleModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm">+ Tambah Jadwal</button>' : ''}
        </div>
      </div>`;

    // Region dropdown for Super Admin
    let regionFilterHtml = '';
    if (role === 'Super Admin') {
      // build options from availableClasses and scheduleData
      const regions = new Set();
      (availableClasses || []).forEach(c => { if (c.region) regions.add(c.region); });
      (scheduleData || []).forEach(s => { if (s.region) regions.add(s.region); });
      const regs = Array.from(regions).sort();
      regionFilterHtml = `<div class="mb-4 flex items-center space-x-3"><label class="text-sm font-medium">Filter Regional:</label>
        <select id="assistant_region_filter" class="px-3 py-2 border rounded-lg">
          <option value="all"${regional === 'all' ? ' selected' : ''}>Semua Regional</option>
          ${regs.map(r => `<option value="${r}"${regional === r ? ' selected' : ''}>${r}</option>`).join('')}
        </select></div>`;
    }

    // Class filter for Admin / Super Admin
    let classFilterHtml = '';
    if (isAdmin) {
      // compute classes available for this admin view
      let classesSet = new Set();
      (availableClasses || []).forEach(c => {
        if (role === 'Super Admin' && regional !== 'all') {
          if (c.region === regional) classesSet.add(c.name);
        } else if (role === 'Super Admin' && regional === 'all') {
          classesSet.add(c.name);
        } else if (role === 'Admin') {
          if (c.region === currentUser.region) classesSet.add(c.name);
        }
      });
      const classes = Array.from(classesSet).sort();
      classFilterHtml = `<div class="mb-4">
        <label class="text-sm font-medium mr-2">Filter Kelas:</label>
        <select id="assistant_class_filter_schedule" class="px-3 py-2 border rounded-lg">
          <option value="all"${classFilter === 'all' ? ' selected' : ''}>Semua Kelas</option>
          ${classes.map(c => `<option value="${c}"${classFilter === c ? ' selected' : ''}>${c}</option>`).join('')}
        </select>
      </div>`;
    }

    // Build table HTML depending on role
    let tableHtml = `<div class="bg-white border border-gray-200 rounded-lg shadow-sm overflow-x-auto">`;
    if (role === 'Siswa') {
      tableHtml += `
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-blue-800 text-white">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px] min-w-[60px]">NO</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">TANGGAL</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">HARI</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">WAKTU</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">NAMA MATERI</th>
            </tr>
          </thead>
          <tbody class="bg-white">`;
      if (list.length === 0) {
        tableHtml += `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Tidak ada jadwal untuk kelas/region Anda.</td></tr>`;
      } else {
        list.forEach((s, idx) => {
          tableHtml += `<tr class="border-t border-gray-100 hover:bg-gray-50">
            <td class="px-4 py-3 text-sm text-center">${idx+1}</td>
            <td class="px-4 py-3 text-sm text-center">${s.date || ''}</td>
            <td class="px-4 py-3 text-sm text-center">${s.day || ''}</td>
            <td class="px-4 py-3 text-sm text-center">${s.time || ''}</td>
            <td class="px-4 py-3 text-sm font-medium text-gray-900">${s.subject || ''}</td>
          </tr>`;
        });
      }
      tableHtml += `</tbody></table>`;
    } else {
      // Admin / Super Admin table (includes kelas and aksi)
      tableHtml += `
        <div class="p-4 flex flex-col md:flex-row md:items-center md:justify-between space-y-3 md:space-y-0">
          <div>${regionFilterHtml || ''}${classFilterHtml || ''}</div>
        </div>
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-blue-800 text-white">
            <tr>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px] min-w-[60px]">NO</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">TANGGAL</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">HARI</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">WAKTU</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">NAMA MATERI</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">KELAS</th>
              <th class="px-4 py-3 text-left text-sm font-semibold text-center text-sm min-w-[120px]">AKSI</th>
            </tr>
          </thead>
          <tbody class="bg-white">`;
      if (list.length === 0) {
        tableHtml += `<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">Tidak ada jadwal untuk regional/kelas terpilih.</td></tr>`;
      } else {
        list.forEach((s, idx) => {
          const kelasText = Array.isArray(s.classes) ? s.classes.join(', ') : (s.classTarget || '');
          tableHtml += `<tr class="border-t border-gray-100 hover:bg-gray-50">
            <td class="px-4 py-3 text-sm text-center">${idx+1}</td>
            <td class="px-4 py-3 text-sm text-center">${s.date || ''}</td>
            <td class="px-4 py-3 text-sm text-center">${s.day || ''}</td>
            <td class="px-4 py-3 text-sm text-center">${s.time || ''}</td>
            <td class="px-4 py-3 text-sm font-medium text-gray-900">${s.subject || ''}</td>
            <td class="px-4 py-3 text-sm text-blue-600">${kelasText}</td>
            <td class="text-center px-4 py-3 text-sm">
              <button onclick="editSchedule(${s.id})" class="text-blue-600 hover:text-blue-800 mr-3">Edit</button>
              <button onclick="deleteSchedule(${s.id})" class="text-red-600 hover:text-red-800">Hapus</button>
            </td>
          </tr>`;
        });
      }
      tableHtml += `</tbody></table>`;
    }
    tableHtml += `</div>`;

    // Compose final HTML
    content.innerHTML = headerHtml + (isAdmin ? '' : '') + '<div class="bg-white/0 p-1">' + (isAdmin ? '' : '') + '</div>' + (isAdmin ? '' : '') + (role === 'Super Admin' ? '' : '') + '<div class="fade-in">' + tableHtml + '</div>';

    // Attach event listeners for filters if present
    const regionSelect = document.getElementById('assistant_region_filter');
    if (regionSelect) {
      regionSelect.addEventListener('change', function(e) {
        selectedAdminRegion = e.target.value;
        // persist and reload
        loadSchedule();
      });
    }
    const classSelect = document.getElementById('assistant_class_filter_schedule');
    if (classSelect) {
      classSelect.addEventListener('change', function(e){
        selectedClassSchedule = e.target.value;
        loadSchedule();
      });
    }
  } catch (err) {
    console.error('Error in assistant overridden loadSchedule:', err);
    // fallback to previous loadSchedule if exists and different
    if (typeof window.loadScheduleOriginal === 'function') {
      window.loadScheduleOriginal();
    }
  }
};

// --- AUTO-EXPAND KATEGORI KE KELAS TURUNAN ---
// Mengubah kategori seperti "SR GOLD" menjadi daftar kelas turunan
function expandCategoryToClasses(category, region) {
    try {
        if (!category) return [];
        const cat = String(category).trim();
        // ambil semua kelas di region (jika region kosong, ambil semua)
        const allClassesInRegion = studentsData
            .filter(s => !region || s.region === region)
            .map(s => (s.class || '').toString().trim().toUpperCase())
            .filter(Boolean);
        const base = cat.toUpperCase().replace(/ /g, '.*');
        const reg = new RegExp('^' + base, 'i');
        const expanded = [...new Set(allClassesInRegion.filter(c => reg.test(c)))];
        // jika tidak ada turunan, kembalikan kategori asli (compatibility)
        return expanded.length ? expanded : [category];
    } catch (e) {
        console.warn('expandCategoryToClasses error', e);
        return [category];
    }
}
// --- AKHIR AUTO-EXPAND ---
if (typeof window.saveMaterial === 'undefined') {
    // Provide a generic saveMaterial used by modal forms if not defined elsewhere.
    window.saveMaterial = function(isEdit, editId) {
        try {
            const topic = document.getElementById('materialTopic') ? document.getElementById('materialTopic').value.trim() : '';
            const description = document.getElementById('materialDescription') ? document.getElementById('materialDescription').value.trim() : '';
            const classes = document.getElementById('materialClasses') ? Array.from(document.getElementById('materialClasses').selectedOptions).map(o=>o.value) : [];
            const region = document.getElementById('materialRegion') ? document.getElementById('materialRegion').value : (currentUser.region || '');
            const youtubeLink = readYoutubeFromForm();
            if (!topic) { alert('Topik materi wajib diisi'); return; }
            if (isEdit && typeof editId !== 'undefined') {
                const idx = classMaterials.findIndex(m=>m.id===editId);
                if (idx!==-1) {
                    classMaterials[idx] = { ...classMaterials[idx], topic, description, classes, region, youtubeLink };
                }
            } else {
                const newId = classMaterials.length ? Math.max(...classMaterials.map(m=>m.id))+1 : 1;
                classMaterials.push({ id: newId, topic, description, classes, region, youtubeLink });
            }
            try { saveAllData(); } catch(e){console.warn(e);}
            closeModal();
            loadMaterials();
            showNotification('Materi berhasil disimpan!', 'success');
        } catch(err){ console.error(err); alert('Gagal menyimpan materi'); }
    }
